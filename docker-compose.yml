name: expedition

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - ./:/app
      - ./var/logs:/var/log/php
    networks:
      - expedition-net
    environment:
      - PHP_IDE_CONFIG=serverName=localhost

  nginx:
    image: nginx:latest
    ports:
      - "8080:80"
    volumes:
      - ./:/app
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - expedition-net

  mariadb:
    image: mariadb:11.4
    stop_grace_period: 30s
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: expedition_db
      MARIADB_USER: expedition_user
      MARIADB_PASSWORD: expedition_password
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data_v3:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    networks:
      - expedition-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      timeout: 5s
      retries: 10
      interval: 5s
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin:latest
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: expedition_user
      PMA_PASSWORD: expedition_password
      PMA_DB: expedition_db
    ports:
      - "8081:80"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - expedition-net

networks:
  expedition-net:
    driver: bridge

volumes:
  mariadb_data_v3:
